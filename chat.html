<!-- 파일명: chat.html | @version 1.0.0 -->
<!-- 지비스 «Claude 채팅» 창 — 이 PC 의 `claude` 를 화면 없이 돌려서 대화한다(지비스 전용).
     색·모양은 위젯과 같은 ui.css(테마)를 쓴다. 동작은 chat.js, 뒤쪽은 claudechat.js. -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Claude 채팅 — 지비스</title>
<link rel="stylesheet" href="ui.css" />
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font-size: 14px; display: flex; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  .cc { display: flex; width: 100%; height: 100%; min-width: 0; }
  /* ── 왼쪽: 세션 목록 ── */
  .cl { flex: 0 0 300px; display: flex; flex-direction: column; background: var(--card); border-right: 1px solid var(--line); min-width: 0; }
  .cnew { margin: 12px 12px 6px; padding: 11px 12px; border-radius: 10px; border: 0; background: var(--now); color: var(--bg); font-weight: 800; font-size: 14px; text-align: left; }
  .cfind { margin: 4px 12px 6px; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--card2); color: var(--fg); font-size: 16px; font-family: inherit; }
  .cchips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 12px 8px; }
  .chip2 { padding: 4px 10px; border-radius: 999px; border: 1px solid transparent; background: var(--card2); font-size: 12px; font-weight: 700; color: var(--fg2); white-space: nowrap; }
  .chip2.on { background: color-mix(in srgb, var(--now) 22%, var(--card)); color: var(--fg); border-color: var(--now); }
  .clist { flex: 1; overflow-y: auto; }
  .cs { padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  .cs b { display: block; font-size: 13.5px; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
  .cs small { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; font-size: 11.5px; color: var(--dim); }
  .cs.on { background: color-mix(in srgb, var(--now) 14%, var(--card)); box-shadow: inset 3px 0 0 var(--now); }
  .cs i { font-style: normal; padding: 0 7px; border-radius: 999px; background: var(--card2); font-weight: 700; }
  .cs i.run { background: color-mix(in srgb, var(--now) 24%, var(--card)); color: var(--fg); }
  .cs i.app { background: color-mix(in srgb, var(--warnfg) 22%, var(--card)); color: var(--warnfg); }
  .cempty { padding: 18px 14px; color: var(--dim); font-size: 13px; }
  /* 원격 제어 스위치 */
  .rc { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--card2); font-size: 11.5px; font-weight: 800; color: var(--dim); white-space: nowrap; min-height: 26px; }
  .rc u { display: inline-block; width: 24px; height: 13px; border-radius: 999px; background: var(--line); position: relative; text-decoration: none; }
  .rc u::after { content: ''; position: absolute; top: 1px; left: 1px; width: 11px; height: 11px; border-radius: 50%; background: #fff; transition: .15s; }
  .rc.on { background: color-mix(in srgb, var(--now) 20%, var(--card)); border-color: var(--now); color: var(--fg); }
  .rc.on u { background: var(--now); } .rc.on u::after { left: 12px; }
  .rc[disabled] { opacity: .5; cursor: default; }
  /* ── 오른쪽: 대화 ── */
  .cm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ch { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; }
  .ch b { font-size: 14px; font-weight: 800; flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn2 { padding: 6px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--card2); font-size: 12.5px; font-weight: 700; min-height: 32px; }
  .btn2.go { background: var(--now); color: var(--bg); border-color: var(--now); }
  .btn2[disabled] { opacity: .5; cursor: default; }
  .rcnote { margin: 8px 14px 0; padding: 7px 11px; border-radius: 9px; background: color-mix(in srgb, var(--now) 12%, var(--card)); font-size: 12px; line-height: 1.5; color: var(--fg2); }
  .msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .u { align-self: flex-end; max-width: 80%; background: var(--now); color: var(--bg); padding: 9px 13px; border-radius: 15px 15px 3px 15px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a { align-self: flex-start; max-width: 90%; background: var(--card); border: 1px solid var(--line); padding: 10px 13px; border-radius: 15px 15px 15px 3px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a code, .u code { background: var(--card2); color: var(--fg); padding: 0 4px; border-radius: 4px; font-size: 12.5px; }
  .a pre { margin: 6px 0; padding: 8px 10px; border-radius: 8px; background: var(--card2); overflow-x: auto; font-size: 12.5px; line-height: 1.45; white-space: pre; }
  .a pre code { background: none; padding: 0; }
  .tool { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); padding: 3px 11px; border-radius: 999px; background: var(--card2); max-width: 92%; }
  .tool b { color: var(--fg2); font-weight: 800; white-space: nowrap; }
  .tool span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool.bad { color: var(--warnfg); }
  .info { align-self: center; font-size: 12px; color: var(--dim); padding: 3px 12px; border-radius: 999px; background: var(--card2); text-align: center; overflow-wrap: anywhere; }
  .info.err { color: var(--warnfg); }
  .hist { align-self: center; font-size: 11.5px; font-weight: 800; color: var(--dim); }
  .think { align-self: flex-start; font-size: 12px; color: var(--dim); }
  .attl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .th { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--card2); }
  .fl { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 22%, transparent); font-size: 12px; font-weight: 700; max-width: 220px; }
  .fl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .u .fl { background: color-mix(in srgb, var(--bg) 28%, transparent); }
  .a .fl { background: var(--card2); }
  /* 허용 묻기 카드 */
  .ask { align-self: flex-start; max-width: 94%; border: 2px solid var(--warnfg); border-radius: 13px; padding: 10px 13px; background: color-mix(in srgb, var(--warnfg) 9%, var(--card)); font-size: 13px; }
  .ask.done { border-color: var(--line); background: var(--card); opacity: .8; }
  .ask > b { display: block; margin-bottom: 4px; font-size: 13.5px; }
  .ask pre { margin: 4px 0 8px; padding: 7px 9px; border-radius: 7px; background: var(--card2); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; color: var(--fg2); }
  .ask .df { color: var(--fg2); } .ask .df .m { color: var(--warnfg); } .ask .df .p { color: var(--now); }
  .ask .r { display: flex; gap: 7px; flex-wrap: wrap; }
  .ok2 { padding: 7px 15px; border-radius: 9px; border: 0; background: var(--now); color: var(--bg); font-weight: 800; font-size: 13px; min-height: 34px; }
  .no2 { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 13px; min-height: 34px; }
  .ask .q { margin: 6px 0 4px; font-weight: 800; }
  .ask .ops { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  /* 입력 */
  .cin { border-top: 1px solid var(--line); padding: 9px 12px 8px; background: var(--card); position: relative; }
  .row { display: flex; gap: 7px; align-items: flex-end; }
  .ta { flex: 1; min-height: 40px; max-height: 180px; resize: none; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); padding: 9px 11px; font-size: 16px; font-family: inherit; color: var(--fg); line-height: 1.45; }
  .send { padding: 10px 16px; border-radius: 11px; border: 0; background: var(--now); color: var(--bg); font-weight: 800; font-size: 14px; min-height: 40px; }
  .send.stop { background: var(--warnfg); }
  .pin { width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--card2); font-size: 17px; }
  .atts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
  .att { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 3px 24px 3px 4px; border-radius: 9px; background: var(--card2); font-size: 12px; font-weight: 700; max-width: 220px; }
  .att img { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; }
  .att span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px; }
  .att button { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; font-size: 14px; color: var(--dim); }
  .foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 5px; font-size: 11px; color: var(--dim); }
  .foot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--now) 16%, var(--card)); border: 2px dashed var(--now); border-radius: 11px; font-weight: 800; z-index: 3; }
  .cc.dragging .drop { display: flex; }
  .empty { margin: auto; text-align: center; color: var(--dim); padding: 30px; line-height: 1.7; font-size: 13.5px; }
  .empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 6px; }
  /* 화면 안 대화상자 */
  .dlg { position: fixed; inset: 0; background: rgba(20, 28, 38, .45); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 14px; }
  .dlgc { width: 400px; max-width: 100%; max-height: 92%; overflow-y: auto; background: var(--card); border-radius: 15px; padding: 17px 17px 13px; box-shadow: 0 8px 30px rgba(0, 0, 0, .3); }
  .dlgc b.t { font-size: 15px; } .dlgc p { margin: 8px 0; font-size: 13px; line-height: 1.55; color: var(--fg2); }
  .dlgc ul { margin: 6px 0 10px; padding-left: 19px; font-size: 12.5px; color: var(--fg2); line-height: 1.65; }
  .dlgc .r { display: flex; gap: 7px; justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; }
  .dlgc .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; z-index: 30; max-width: 90%; box-shadow: 0 4px 16px rgba(0, 0, 0, .3); }
  .ulink { border: 0; background: transparent; padding: 0 2px; font-size: 11px; color: var(--fg2); font-weight: 700; text-decoration: underline dotted; }
  .ub { margin: 10px 0 4px; } .uh { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; margin-bottom: 4px; } .uh span { color: var(--fg2); text-align: right; }
  .ut { height: 10px; border-radius: 999px; background: var(--card2); overflow: hidden; } .ut i { display: block; height: 100%; background: var(--now); border-radius: 999px; }
  .ut i.warm { background: #e0a020; } .ut i.hot { background: var(--warnfg); }
  .hide { display: none !important; }
  /* ── 좁은 창: 목록과 대화를 한 화면씩 ── */
  @media (max-width: 760px) {
    .cl { flex: 1 1 100%; border-right: 0; }
    .cc.v-chat .cl { display: none; }
    .cc.v-list .cm { display: none; }
    .u, .a { max-width: 94%; }
  }
  @media (min-width: 761px) { .only-narrow { display: none !important; } }
</style>
</head>
<body>
<div class="cc" id="cc"></div>
<div id="layer"></div>
<script src="chat.js"></script>
</body>
</html>
