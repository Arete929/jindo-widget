<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>수업진도</title>
<style>
  :root {
    --bg: #15181d;
    --card: #1c2027;
    --line: #2b313a;
    --fg: #eef1f5;
    --dim: #97a1ae;
    --accent: #ff8b3d;
    --now: #35c98b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 13px;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }
  #app { padding: 10px 11px 11px; }

  /* ── 머리 ── */
  .head { display: flex; align-items: center; gap: 6px; }
  .date { font-size: 14px; font-weight: 700; letter-spacing: -.2px; }
  .dow { color: var(--dim); font-size: 12px; font-weight: 600; }
  .spacer { flex: 1; }
  .ico {
    -webkit-app-region: no-drag;
    background: none; border: 0; color: var(--dim);
    font-size: 13px; cursor: pointer; padding: 2px 4px; border-radius: 5px;
  }
  .ico:hover { background: #262c35; color: var(--fg); }

  /* ── 학사일정 메모 ── */
  .note {
    margin-top: 7px; padding: 5px 8px; border-radius: 6px;
    background: #2a2419; color: #f0c98a; font-size: 11.5px; font-weight: 600;
    line-height: 1.35;
  }
  .note.hol { background: #331d1d; color: #f0928a; }

  /* ── 칩 ── */
  .chips { display: flex; gap: 5px; margin: 9px 0 8px; }
  .chip {
    -webkit-app-region: no-drag;
    flex: 1; padding: 5px 0; border-radius: 7px; cursor: pointer;
    background: none; border: 1px solid var(--line); color: var(--dim);
    font-size: 11.5px; font-weight: 700; font-family: inherit;
  }
  .chip:hover { border-color: #3d4551; color: var(--fg); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #1a1206; }

  /* ── 오늘 수업 ── */
  .lesson {
    display: flex; gap: 9px; padding: 7px 8px; border-radius: 8px;
    background: var(--card); margin-bottom: 5px; align-items: flex-start;
  }
  .lesson.past { opacity: .42; }
  .lesson.now { background: #12291f; box-shadow: inset 0 0 0 1.5px var(--now); }
  .per {
    min-width: 34px; text-align: center; padding-top: 1px;
    font-size: 13px; font-weight: 800; color: var(--accent);
  }
  .lesson.now .per { color: var(--now); }
  .per small { display: block; font-size: 9.5px; font-weight: 600; color: var(--dim); margin-top: 1px; }
  .body { flex: 1; min-width: 0; }
  .who { font-size: 13px; font-weight: 700; }
  .what { font-size: 11.5px; color: var(--dim); margin-top: 2px; line-height: 1.35; }
  .what b { color: #cfd6df; font-weight: 700; }
  .badge {
    display: inline-block; margin-left: 5px; padding: 1px 5px; border-radius: 4px;
    font-size: 9.5px; font-weight: 700; vertical-align: 1.5px;
  }
  .b-수행평가 { background: #3a2340; color: #e0a8f0; }
  .b-시험 { background: #402323; color: #f0a0a0; }
  .b-행사 { background: #1f3340; color: #8ecbf0; }
  .b-순연 { background: #2f2a1a; color: #e8cf87; }
  .b-이동 { background: #1d3330; color: #86ddc4; }
  .when { font-size: 11px; font-weight: 700; color: var(--now); margin-top: 3px; }
  .when.soon { color: var(--accent); }

  /* ── 이번 주 ── */
  .wk { display: flex; flex-direction: column; gap: 4px; }
  .wkrow { display: flex; gap: 7px; align-items: flex-start; padding: 5px 7px; border-radius: 7px; background: var(--card); }
  .wkrow.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .wkrow.hol { opacity: .5; }
  .wkd { min-width: 46px; font-size: 11.5px; font-weight: 800; }
  .wkd small { display: block; font-size: 9.5px; font-weight: 600; color: var(--dim); }
  .wkl { flex: 1; font-size: 11px; color: var(--dim); line-height: 1.5; }
  .wkl span { color: #cfd6df; }

  /* ── 진도 ── */
  .pg { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 7px; background: var(--card); margin-bottom: 4px; }
  .pgc { min-width: 40px; font-size: 12px; font-weight: 700; }
  .bar { flex: 1; height: 7px; border-radius: 4px; background: #262c35; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .pgn { min-width: 62px; text-align: right; font-size: 11px; color: var(--dim); font-weight: 600; }
  .pgn em { font-style: normal; color: var(--fg); font-weight: 700; }
  .gap { color: #f0928a; font-weight: 700; }

  /* ── 이번 주 압축 격자 ── */
  .wknav { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
  .wkb {
    -webkit-app-region: no-drag;
    background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 6px; padding: 3px 8px; cursor: pointer;
    font-size: 11px; font-weight: 800; font-family: inherit;
  }
  .wkb:hover { border-color: #3d4551; color: var(--fg); }
  .wkb.now { background: var(--accent); border-color: var(--accent); color: #1a1206; }
  .wklab { flex: 1; text-align: center; font-size: 11.5px; font-weight: 800; line-height: 1.2; }
  .wklab small { display: block; font-size: 9px; font-weight: 600; color: var(--dim); }

  .gr { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .gr th, .gr td { border: 1px solid #232830; padding: 0; text-align: center; }
  .gr thead th { padding: 3px 1px 4px; font-size: 11px; font-weight: 800; background: #1a1e25; }
  .gr thead th small { display: block; font-size: 9px; font-weight: 600; color: var(--dim); }
  .gr thead th i { display: block; font-style: normal; font-size: 8.5px; color: #d8ac6e;
                   line-height: 1.3; margin-top: 1px; }
  .gr thead th i em { display: block; font-style: normal;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gr td.pc, .gr th.pc { width: 20px; background: #1a1e25; font-size: 10px; font-weight: 800; color: var(--dim); }
  .gr td { height: 34px; font-size: 10px; }
  .gr td.c { position: relative; color: #fff; font-weight: 700; line-height: 1.15; padding: 2px 1px; }
  .gr td.c b { font-size: 11px; font-weight: 800; }
  .gr td.c u { display: block; text-decoration: none; font-size: 8.5px; opacity: .9;
               line-height: 1.15; max-height: 20px; overflow: hidden; word-break: break-all; }
  .gr td.c s { position: absolute; top: 2px; right: 2px; width: 4px; height: 4px;
               border-radius: 999px; background: #fff; opacity: .9; }
  .gr td.u0 { background: #3a2f8f; } .gr td.u1 { background: #12708a; } .gr td.u2 { background: #96491a; }
  .gr td.u3 { background: #1d7440; } .gr td.u4 { background: #8a2456; } .gr td.u5 { background: #5c3aad; }
  /* 학사일정으로 수업이 없어진 칸 — 수업 색을 쓰지 않는다 */
  .gr td.blk { background: #2b2721; color: #b09b7d; }
  .gr td.blk b { opacity: .75; }
  .gr td.cal { background: #232a35; color: #9fb0c4; font-weight: 700; font-size: 9.5px; }
  .gr td.cal u { color: #7d8b9c; }
  .gr td.out { background: #1a1e25; color: #5d6672; text-decoration: line-through; }
  .gr td.hol { background: repeating-linear-gradient(45deg, #241a1a, #241a1a 4px, #2e2020 4px, #2e2020 8px); }
  .gr .tdy { box-shadow: inset 0 0 0 1.5px var(--accent); }

  /* ── 주간업무 ── */
  .wq {
    -webkit-app-region: no-drag;
    flex: 1; min-width: 60px; background: #1a1e25; border: 1px solid var(--line);
    color: var(--fg); border-radius: 6px; padding: 3px 8px;
    font-size: 11px; font-family: inherit; outline: none;
  }
  .wq:focus { border-color: var(--accent); }
  .wkb[disabled] { opacity: .35; cursor: default; }
  .wkhead { font-size: 11.5px; font-weight: 800; margin-bottom: 6px; text-align: center; }
  .wkcal { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
  .wkchip { padding: 2px 7px; border-radius: 5px; background: #2a2419; color: #f0c98a;
            font-size: 10px; font-weight: 700; line-height: 1.35; }
  .wkdt { background: var(--card); border-radius: 7px; padding: 6px 8px; margin-bottom: 5px; }
  .wkdt b { display: block; font-size: 11.5px; font-weight: 800; color: var(--accent); margin-bottom: 3px; }
  .wkln { font-size: 10.5px; color: #c3cbd6; line-height: 1.45; margin-bottom: 2px; }
  .wkres { display: flex; flex-direction: column; gap: 3px; }
  .wkline { background: var(--card); border-radius: 6px; padding: 5px 7px;
            font-size: 10.5px; color: #c3cbd6; line-height: 1.45; }
  .wkwhen { display: inline-block; margin-right: 5px; padding: 1px 5px; border-radius: 4px;
            background: #262c35; color: var(--dim); font-size: 9.5px; font-weight: 800; }
  .wkdept { display: inline-block; margin-right: 5px; color: var(--accent); font-size: 9.5px; font-weight: 800; }
  .wkdept.cal { color: #f0c98a; }

  .empty { padding: 18px 6px; text-align: center; color: var(--dim); font-size: 12px; line-height: 1.6; }
  .btn {
    -webkit-app-region: no-drag;
    display: inline-block; margin-top: 8px; padding: 6px 14px; border-radius: 7px;
    background: var(--accent); color: #1a1206; border: 0; cursor: pointer;
    font-size: 12px; font-weight: 700; font-family: inherit;
  }
  .foot { margin-top: 7px; text-align: right; font-size: 9.5px; color: #5d6672; }
</style>
</head>
<body>
<div id="app"><div class="empty">불러오는 중…</div></div>

<script>
var STATE = null, VIEW = 'today', SCALE = 1, VER = '';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function pad(n) { return String(n).padStart(2, '0'); }
function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
/* "11:00~11:45" 또는 "11:00" 을 분 단위로 */
function parseTime(t) {
  if (!t) return null;
  var m = String(t).match(/^(\d{1,2}):(\d{2})(?:~(\d{1,2}):(\d{2}))?/);
  if (!m) return null;
  var s = Number(m[1]) * 60 + Number(m[2]);
  var e = m[3] ? Number(m[3]) * 60 + Number(m[4]) : s + 45;
  return { s: s, e: e };
}
function human(min) {
  if (min >= 60) return Math.floor(min / 60) + '시간 ' + (min % 60) + '분';
  return min + '분';
}

/* ── 오늘 ── */
function viewToday(d) {
  var ls = d.lessons || [];
  if (d.holiday) return '<div class="empty">휴업일이라 수업이 없습니다.</div>';
  if (!d.weekday) return '<div class="empty">주말입니다. 푹 쉬세요.</div>';
  if (!ls.length) return '<div class="empty">오늘은 배정된 수업이 없습니다.</div>';

  var n = nowMin(), html = '';
  // 지금 진행 중인 수업 / 아직 안 한 첫 수업 찾기
  var curIdx = -1, nextIdx = -1;
  ls.forEach(function (l, i) {
    var t = parseTime(l.time);
    if (!t) return;
    if (n >= t.s && n < t.e) curIdx = i;
    else if (n < t.s && nextIdx < 0) nextIdx = i;
  });

  ls.forEach(function (l, i) {
    var t = parseTime(l.time);
    var past = t && n >= t.e;
    var cls = 'lesson' + (i === curIdx ? ' now' : past ? ' past' : '');
    var badges = '';
    if (l.type && l.type !== '수업') badges += '<span class="badge b-' + esc(l.type) + '">' + esc(l.type) + '</span>';
    if (l.shifted) badges += '<span class="badge b-순연">↷순연</span>';
    if (l.movedIn) badges += '<span class="badge b-이동">이동</span>';

    var what = l.n
      ? '<b>' + esc(l.unit) + ' ' + l.n + '차시</b>' + (l.topic ? ' · ' + esc(l.topic) : '')
      : '차시 미지정';

    var when = '';
    if (i === curIdx && t) when = '<div class="when">지금 수업 중 · ' + human(t.e - n) + ' 남음</div>';
    else if (i === nextIdx && t) when = '<div class="when soon">' + human(t.s - n) + ' 뒤 시작</div>';

    html += '<div class="' + cls + '">'
      + '<div class="per">' + l.period + '<small>' + esc((l.time || '').split('~')[0]) + '</small></div>'
      + '<div class="body"><div class="who">' + esc(l.grade) + ' ' + esc(l.cls) + badges + '</div>'
      + '<div class="what">' + what + '</div>' + when + '</div></div>';
  });
  return html;
}

/* ── 이번 주 : 압축 격자 (교시 × 요일) ──
   앱의 표를 좁은 카드에 맞게 줄인 것. 자세히 볼 때는 ⤢ 로 큰 창을 연다.
   ◀ ▶ 로 다른 주도 볼 수 있다 (그 주 자료는 앱에게 그때 물어본다). */
var WEEKOFF = 0, WK = null, wkBusy = false;

function loadWeek(off) {
  if (wkBusy) return;
  wkBusy = true;
  WEEKOFF = off;
  widgetAPI.getWeek(off).then(function (d) {
    wkBusy = false;
    WK = d || null;
    render();
  }).catch(function () { wkBusy = false; WK = null; render(); });
}
function whenTxt(date, period) {
  var p = String(date || '').split('-');
  var md = p.length === 3 ? Number(p[1]) + '/' + Number(p[2]) : '';
  return md + (period ? ' ' + period + '교시' : '');
}
function cellTip(c, l) {
  if (l.blocked) {
    return l.cls + ' · ' + ((c.cellCal && c.cellCal.lbl) || '수업 없음')
      + ((c.cellCal && c.cellCal.note) ? ' · ' + c.cellCal.note : '')
      + (c.pushedTo ? '\n→ ' + whenTxt(c.pushedTo.date, c.pushedTo.period) + '로 밀림' : '')
      + (l.orig ? '\n원래 ' + l.orig + '교시' : '')
      + (c.time ? '\n' + c.time : '');
  }
  return l.cls + ' · ' + (l.unit || '') + (l.n ? ' ' + l.n + '차시' : ' 차시미정')
    + (l.topic ? ' · ' + l.topic : '') + (l.detail ? '\n' + l.detail : '')
    + (l.orig ? '\n원래 ' + l.orig + '교시' : '')
    + (l.movedIn ? '\n(수업이동)' : '') + (l.assigned ? '\n(직접 배정)' : '')
    + (l.shifted ? '\n(순연)' : '') + (c.time ? '\n' + c.time : '');
}

/* 학사일정 메모는 콤마로 나뉜 여러 건이다 — 한 줄에 하나씩 보여준다 */
function noteLines(note) {
  if (!note) return '';
  var parts = String(note).split(',').map(function (t) { return t.trim(); })
    .filter(function (t) { return t; });
  if (!parts.length) return '';
  return '<i title="' + esc(parts.join(' / ')) + '">'
    + parts.map(function (t) { return '<em>' + esc(t) + '</em>'; }).join('') + '</i>';
}

function viewWeek(d) {
  if (!WK) {
    if (!wkBusy) loadWeek(WEEKOFF);
    return '<div class="empty">시간표를 불러오는 중…</div>';
  }
  var days = WK.days || [];
  if (!days.length) return '<div class="empty">시간표가 없습니다.</div>';

  // 주 이동 줄
  var nav = '<div class="wknav">'
    + '<button class="wkb" data-off="' + (WEEKOFF - 1) + '" title="이전 주">◀</button>'
    + '<span class="wklab">' + esc(WK.label || '') + '<small>' + esc(WK.range || '') + '</small></span>'
    + '<button class="wkb" data-off="' + (WEEKOFF + 1) + '" title="다음 주">▶</button>'
    + (WEEKOFF !== 0 ? '<button class="wkb now" data-off="0">이번주</button>' : '')
    + '</div>';

  var h = nav + '<table class="gr"><thead><tr><th class="pc"></th>';
  days.forEach(function (w) {
    h += '<th class="' + (w.today ? 'tdy' : '') + '">' + esc(w.dow)
      + '<small>' + esc(w.md) + '</small>'
      + noteLines(w.note)
      + '</th>';
  });
  h += '</tr></thead><tbody>';

  for (var p = 1; p <= 7; p++) {
    h += '<tr><td class="pc">' + p + '</td>';
    days.forEach(function (w) {
      var c = (w.cells || [])[p - 1] || {};
      var klass = w.today ? ' tdy' : '';
      if (w.holiday) { h += '<td class="hol' + klass + '"></td>'; return; }
      if (c.lesson) {
        var l = c.lesson;
        // 학사일정(동아리 등)으로 수업이 없어진 칸 — 수업처럼 그리면 안 된다
        if (l.blocked) {
          h += '<td class="c blk' + klass + '" title="' + esc(cellTip(c, l)) + '">'
            + '<b>' + esc(l.cls) + '</b><u>'
            + esc((c.cellCal && c.cellCal.lbl) || '수업 없음') + '</u></td>';
          return;
        }
        // 차시 번호 뒤에 주제(또는 상세)를 함께 — "1 개학 후 측정" 처럼
        var what = l.n ? String(l.n) : '';
        var extra = l.topic || l.detail || '';
        if (extra) what += (what ? ' ' : '') + extra;
        if (!what) what = '차시미정';
        h += '<td class="c u' + (l.u % 6) + klass + '" title="' + esc(cellTip(c, l)) + '">'
          + '<b>' + esc(l.cls) + '</b><u>' + esc(what) + '</u>'
          + (l.movedIn || l.assigned || l.shifted ? '<s></s>' : '') + '</td>';
        return;
      }
      if (c.movedOut) {
        h += '<td class="c out' + klass + '" title="' + esc(c.movedOut.cls + ' → 다른 날로 옮김') + '">'
          + '<b>' + esc(c.movedOut.cls) + '</b></td>';
        return;
      }
      if (c.cal) {
        h += '<td class="c cal' + klass + '" title="' + esc(c.cal.lbl + (c.cal.note ? ' · ' + c.cal.note : '')) + '">'
          + esc(c.cal.lbl) + (c.cal.note ? '<u>' + esc(c.cal.note) + '</u>' : '') + '</td>';
        return;
      }
      h += '<td class="' + (klass || '') + '"></td>';
    });
    h += '</tr>';
  }
  h += '</tbody></table>';
  return h;
}

/* ── 주간업무 ──
   앱이 구글 문서(입력본·합본)를 읽어 저장해 둔 것을 보여준다.
   합본은 주차가 20개쯤 쌓여 있어서 ◀ ▶ 로 넘기거나 검색으로 찾는다. */
var WORK = null, workBusy = false, workDoc = 'input', workOff = 0, workQ = '';

function loadWork() {
  if (workBusy) return;
  workBusy = true;
  widgetAPI.getWork().then(function (d) {
    workBusy = false; WORK = d || { empty: true }; render();
  }).catch(function () { workBusy = false; WORK = { empty: true }; render(); });
}

function workHit(line, q) { return q && line.toLowerCase().indexOf(q.toLowerCase()) >= 0; }

function viewWork() {
  if (!WORK) { loadWork(); return '<div class="empty">주간업무를 불러오는 중…</div>'; }

  var weeks = (workDoc === 'input' ? WORK.input : WORK.merged) || [];
  var h = '<div class="wknav">'
    + '<button class="wkb' + (workDoc === 'input' ? ' now' : '') + '" data-doc="input">입력본</button>'
    + '<button class="wkb' + (workDoc === 'merged' ? ' now' : '') + '" data-doc="merged">합본</button>'
    + '<input class="wq" type="text" placeholder="검색" value="' + esc(workQ) + '">'
    + '<button class="wkb" id="workGet" title="구글 문서에서 다시 가져오기">⟳</button>'
    + '</div>';

  if (!weeks.length) {
    return h + '<div class="empty">아직 가져온 주간업무가 없습니다.<br>'
      + '<button class="btn" onclick="widgetAPI.openLogin()">지금 가져오기</button>'
      + '<div style="margin-top:8px;font-size:10.5px;color:#6f7885">'
      + '크롬이 열립니다. 구글 로그인하면 문서를 읽어옵니다.'
      + (WORK.error ? '<br>' + esc(WORK.error) : '') + '</div></div>';
  }

  // 검색 — 모든 주차의 부서 내용에서 찾는다
  if (workQ) {
    var rows = [], q = workQ;
    weeks.forEach(function (w) {
      w.depts.forEach(function (p) {
        p.lines.forEach(function (t) {
          if (workHit(t, q) && rows.length < 60) {
            rows.push('<div class="wkline"><span class="wkwhen">' + esc(shortRange(w.range)) + '</span>'
              + '<span class="wkdept">' + esc(p.name) + '</span>' + esc(t) + '</div>');
          }
        });
      });
      (w.notes || []).forEach(function (t) {
        if (workHit(t, q) && rows.length < 60) {
          rows.push('<div class="wkline"><span class="wkwhen">' + esc(shortRange(w.range)) + '</span>'
            + '<span class="wkdept cal">학사일정</span>' + esc(t) + '</div>');
        }
      });
    });
    return h + (rows.length
      ? '<div class="wkres">' + rows.join('') + '</div>'
      : '<div class="empty">「' + esc(workQ) + '」 찾은 것이 없습니다.</div>');
  }

  var i = Math.min(Math.max(workOff, 0), weeks.length - 1);
  var w = weeks[i];
  if (weeks.length > 1) {
    h += '<div class="wknav">'
      + '<button class="wkb" data-woff="' + (i + 1) + '"' + (i >= weeks.length - 1 ? ' disabled' : '') + '>◀ 이전</button>'
      + '<span class="wklab">' + esc(shortRange(w.range)) + '<small>' + (i + 1) + ' / ' + weeks.length + '</small></span>'
      + '<button class="wkb" data-woff="' + (i - 1) + '"' + (i <= 0 ? ' disabled' : '') + '>다음 ▶</button>'
      + '</div>';
  } else {
    h += '<div class="wkhead">' + esc(w.range) + '</div>';
  }

  if ((w.notes || []).length) {
    h += '<div class="wkcal">' + w.notes.map(function (t) {
      return '<span class="wkchip">' + esc(t) + '</span>';
    }).join('') + '</div>';
  }

  h += w.depts.map(function (p, di) {
    return '<div class="wkdt"><b>' + esc(p.name) + '</b>'
      + p.lines.map(function (t) { return '<div class="wkln">' + esc(t) + '</div>'; }).join('')
      + '</div>';
  }).join('') || '<div class="empty">이 주차에는 등록된 업무가 없습니다.</div>';
  return h;
}
function shortRange(r) {
  // "2026. 8. 24.(월) ~ 2026. 8. 28.(금)" -> "8/24 ~ 8/28"
  var m = String(r || '').match(/(\d{1,2})\s*\.\s*(\d{1,2})\s*\.?\s*\([월화수목금토일]\)\s*[~〜～]\s*20\d\d\s*\.\s*(\d{1,2})\s*\.\s*(\d{1,2})/);
  if (!m) return String(r || '').slice(0, 22);
  return m[1] + '/' + m[2] + ' ~ ' + m[3] + '/' + m[4];
}

/* ── 컴시간 ──
   설정 창에서 한 번 불러온 학교 시간표를 보여준다. 교사·학급 중 불러온 것만 나온다. */
var CM = null, cmBusy = false, cmMode = '', cmGrade = 1, cmCls = 1;

function loadComci() {
  if (cmBusy) return;
  cmBusy = true;
  widgetAPI.comciGet().then(function (r) {
    cmBusy = false; CM = r || { empty: true }; render();
  }).catch(function () { cmBusy = false; CM = { empty: true }; render(); });
}

function cmTable(days, cell) {
  var maxP = 1;
  days.forEach(function (d) { maxP = Math.max(maxP, (d.periods || []).length); });
  var h = '<table class="gr"><thead><tr><th class="pc"></th>'
    + days.map(function (d) { return '<th>' + esc(d.dow) + '</th>'; }).join('') + '</tr></thead><tbody>';
  for (var p = 0; p < maxP; p++) {
    h += '<tr><td class="pc">' + (p + 1) + '</td>';
    days.forEach(function (d) {
      var x = (d.periods || [])[p];
      h += x ? cell(x) : '<td></td>';
    });
    h += '</tr>';
  }
  return h + '</tbody></table>';
}

function viewComci() {
  if (!CM) { loadComci(); return '<div class="empty">컴시간 자료를 불러오는 중…</div>'; }
  var cfg = CM.config || {}, d = CM.data;
  if (!d) {
    return '<div class="empty">아직 불러온 컴시간 시간표가 없습니다.<br>'
      + '<button class="btn" onclick="widgetAPI.openSettings()">설정에서 불러오기</button>'
      + '<div style="margin-top:8px;font-size:10.5px;color:#6f7885">'
      + '학교를 고르고 «지금 불러오기» 를 누르면 됩니다.</div></div>';
  }
  var hasT = !!(d.byTeacher && d.byTeacher.length);
  var hasC = !!(d.classes && d.classes.length);
  if (!cmMode) cmMode = hasT ? 'teacher' : 'class';
  if (cmMode === 'teacher' && !hasT) cmMode = 'class';
  if (cmMode === 'class' && !hasC) cmMode = 'teacher';

  var h = '<div class="wknav">';
  if (hasT) h += '<button class="wkb' + (cmMode === 'teacher' ? ' now' : '') + '" data-cm="teacher">교사</button>';
  if (hasC) h += '<button class="wkb' + (cmMode === 'class' ? ' now' : '') + '" data-cm="class">학급</button>';
  h += '<span class="wklab">' + esc(d.schoolName || d.school || '')
    + '<small>' + esc((d.updatedAt || '').slice(0, 10)) + ' 기준</small></span>'
    + '<button class="wkb" id="cmGet" title="설정에서 다시 불러오기">⚙</button></div>';

  if (cmMode === 'teacher') {
    // 저장은 번호로 한다 — 가려진 이름은 겹칠 수 있다(김진호·김민호 -> 둘 다 김*호)
    var me = d.byTeacher.filter(function (t) { return t.i === cfg.teacherIdx; })[0]
      || d.byTeacher.filter(function (t) { return t.name === cfg.teacher; })[0]
      || d.byTeacher[0];
    h += '<div class="wknav" style="margin-bottom:5px"><span class="wklab" style="text-align:left">'
      + esc(me.name) + ' 선생님<small>설정에서 내 이름을 바꿀 수 있어요</small></span></div>';
    h += cmTable(me.days, function (x) {
      return '<td class="c u1" title="' + esc(x.grade + '-' + x.cls + ' ' + x.subject) + '">'
        + '<b>' + x.grade + '-' + x.cls + '</b><u>' + esc(x.subject) + '</u></td>';
    });
    return h;
  }

  // 학급 — 학년·반 고르기
  var gsel = d.classes.filter(function (g) { return g.grade === cmGrade; })[0] || d.classes[0];
  cmGrade = gsel.grade;
  h += '<div class="wknav">'
    + d.classes.map(function (g) {
      return '<button class="wkb' + (g.grade === cmGrade ? ' now' : '') + '" data-cg="' + g.grade + '">'
        + g.grade + '학년</button>';
    }).join('')
    + '<span style="flex:1"></span>'
    + gsel.classes.map(function (c) {
      return '<button class="wkb' + (c.cls === cmCls ? ' now' : '') + '" data-cc="' + c.cls + '">'
        + c.cls + '반</button>';
    }).join('') + '</div>';
  var cl = gsel.classes.filter(function (c) { return c.cls === cmCls; })[0] || gsel.classes[0];
  cmCls = cl.cls;
  h += cmTable(cl.days, function (x) {
    return '<td class="c u0" title="' + esc(x.subject + ' / ' + x.teacher) + '">'
      + '<b>' + esc(x.subject) + '</b><u>' + esc(x.teacher) + '</u></td>';
  });
  return h;
}

/* ── 반별 진도 ── */
function viewProgress(d) {
  var ps = (d.progress || []).filter(function (p) { return p.total > 0; });
  if (!ps.length) return '<div class="empty">진도 자료가 아직 없습니다.</div>';
  var max = Math.max.apply(null, ps.map(function (p) { return p.total; }));
  return ps.map(function (p) {
    var w = max ? Math.round(p.done / max * 100) : 0;
    var gap = p.gap < 0 ? '<span class="gap"> ' + p.gap + '</span>' : '';
    return '<div class="pg"><div class="pgc">' + esc(p.cls) + '</div>'
      + '<div class="bar"><i style="width:' + w + '%"></i></div>'
      + '<div class="pgn"><em>' + p.done + '</em>/' + p.total + '차시' + gap + '</div></div>';
  }).join('');
}

function render() {
  var app = document.getElementById('app');
  if (!STATE) { app.innerHTML = '<div class="empty">불러오는 중…</div>'; return report(); }

  if (STATE.needLogin) {
    // 구글이 앱 안 브라우저 로그인을 막기 때문에, 크롬을 열어 거기서 로그인하고
    // 결과만 위젯이 넘겨받는다 (main.js 의 startLogin 참고).
    app.innerHTML = '<div class="empty">수업진도에 로그인해 주세요.'
      + '<br><button class="btn" onclick="widgetAPI.openLogin()">크롬으로 로그인</button>'
      + '<div style="margin-top:9px;font-size:10.5px;line-height:1.5;color:#6f7885">'
      + '크롬 탭이 열립니다. 거기서 구글 로그인하면<br>'
      + '위젯이 자동으로 이어받아요.</div></div>';
    return report();
  }

  var d = STATE, html = '';
  html += '<div class="head"><span class="date">' + esc(d.date.slice(5).replace('-', '월 ')) + '일</span>'
    + '<span class="dow">' + esc(d.dow) + '요일</span><span class="spacer"></span>'
    + '<button class="ico" title="주간 시간표 크게 보기" onclick="widgetAPI.openTimetable()">⤢</button>'
    + '<button class="ico" title="설정" onclick="widgetAPI.openSettings()">⚙</button>'
    + '<button class="ico" title="지금 새로고침" onclick="widgetAPI.refreshNow()">⟳</button>'
    + '<button class="ico" title="수업진도 앱 열기(크롬)" onclick="widgetAPI.openApp()">↗</button></div>';

  if (d.note || d.holiday) {
    html += '<div class="note' + (d.holiday ? ' hol' : '') + '">'
      + (d.holiday ? '🚫 휴업일' : '📌 오늘 일정') + (d.note ? ' · ' + esc(d.note) : '') + '</div>';
  }

  html += '<div class="chips">'
    + ['today,오늘', 'week,이번주', 'progress,진도', 'work,주간업무', 'comci,컴시간'].map(function (s) {
        var p = s.split(',');
        return '<button class="chip' + (VIEW === p[0] ? ' on' : '') + '" data-v="' + p[0] + '">' + p[1] + '</button>';
      }).join('') + '</div>';

  html += VIEW === 'week' ? viewWeek(d)
    : VIEW === 'progress' ? viewProgress(d)
    : VIEW === 'work' ? viewWork()
    : VIEW === 'comci' ? viewComci()
    : viewToday(d);
  app.innerHTML = html;

  app.querySelectorAll('.wkb').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.off !== undefined) { WK = null; loadWeek(Number(b.dataset.off)); return; }
      if (b.dataset.doc) { workDoc = b.dataset.doc; workOff = 0; render(); return; }
      if (b.dataset.woff !== undefined) { workOff = Number(b.dataset.woff); render(); return; }
      if (b.id === 'workGet') { widgetAPI.openLogin(); return; }
      if (b.id === 'cmGet') { widgetAPI.openSettings(); return; }
      if (b.dataset.cm) { cmMode = b.dataset.cm; render(); return; }
      if (b.dataset.cg) { cmGrade = Number(b.dataset.cg); cmCls = 1; render(); return; }
      if (b.dataset.cc) { cmCls = Number(b.dataset.cc); render(); return; }
    });
  });
  var wq = app.querySelector('.wq');
  if (wq) {
    wq.addEventListener('input', function () { workQ = wq.value.trim(); workOff = 0; render(); });
    if (workQ) { wq.focus(); wq.setSelectionRange(workQ.length, workQ.length); }
  }

  app.querySelectorAll('.chip').forEach(function (b) {
    b.addEventListener('click', function () {
      VIEW = b.dataset.v;
      widgetAPI.setView(VIEW);
      render();
    });
  });
  report();
}

/* 내용 높이를 알려주면 메인이 카드 높이를 맞춰준다 */
function report() {
  requestAnimationFrame(function () {
    widgetAPI.reportHeight(document.getElementById('app').scrollHeight + 4);
  });
}

// 설정에서 컴시간을 바꾸거나 다시 불러오면, 들고 있던 자료를 버리고 새로 읽는다
widgetAPI.onComciChanged(function () { CM = null; if (VIEW === 'comci') render(); });

widgetAPI.onData(function (p) {
  STATE = p.data;
  VIEW = p.view || VIEW;
  VER = p.version || '';
  if (p.scale && p.scale !== SCALE) {
    SCALE = p.scale;
    document.body.style.zoom = SCALE;
  }
  if (VIEW === 'week' && STATE && STATE.ready) { WK = null; loadWeek(WEEKOFF); }
  render();
});

// 남은 시간·지금 수업 표시는 1분마다 다시 그린다 (자료는 그대로, 시계만 흐른다)
setInterval(function () { if (STATE && !STATE.needLogin && VIEW === 'today') render(); }, 30 * 1000);
</script>
