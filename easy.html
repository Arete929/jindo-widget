<!-- 파일명: easy.html | @version 1.7.0 -->
<!-- 혜원이지 (HYEWON EASY) — 위젯과 달리 «열어서 일하는» 넓은 창.
     색·모양은 위젯과 같은 ui.css 를 함께 쓴다(테마 일곱). 자료를 읽어 오는 부분은
     위젯이 쓰던 그대로다 — 여기서는 화면만 넓게 다시 그린다. -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>혜원이지</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700;800&display=swap" />
<link rel="stylesheet" href="ui.css" />
<style>
  /* ── 창 짜임 — 왼쪽 메뉴 + 오른쪽 내용 ── */
  html, body { overflow: hidden; height: 100%; }
  /* ★ 위에서 아래로: [가로지르는 띠] 그리고 그 밑에 [사이드바 | 본문]
     띠가 사이드바 위까지 지나가야 어느 화면에 있든 업데이트를 놓치지 않는다. */
  body { display: flex; flex-direction: column; font-size: 14px; }
  .ebar:empty { display: none; }
  .ebar { flex: 0 0 auto; padding: 8px 12px 0; background: var(--card); }
  .ebody { flex: 1 1 auto; display: flex; min-height: 0; }

  .side {
    flex: 0 0 210px; height: 100%; overflow-y: auto;
    background: var(--card); border-right: 1px solid var(--line);
    padding: 16px 12px; display: flex; flex-direction: column; gap: 3px;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 2px 6px 14px; }
  .brand img { width: 26px; height: 26px; object-fit: contain; -webkit-user-drag: none; }
  .brand b { font-size: 17px; font-weight: 800; letter-spacing: -.4px; }

  .nav {
    display: flex; align-items: center; gap: 9px; width: 100%;
    background: none; border: 0; border-radius: 9px; cursor: pointer;
    padding: 9px 11px; font-family: inherit; font-size: 13.5px; font-weight: 700;
    color: var(--dim); text-align: left;
  }
  .nav:hover { background: var(--card2); color: var(--fg); }
  .nav.on { background: var(--accent); color: var(--on); }
  .nav i { font-style: normal; font-size: 15px; width: 18px; text-align: center; }
  .nav img { width: 18px; height: 18px; object-fit: contain; flex: 0 0 auto;
             -webkit-user-drag: none; }
  /* 아이콘만 볼 때 — 그림을 가운데로 */
  .nav.navicon { justify-content: center; padding: 9px 0; }
  .navgap { height: 10px; }
  /* 사이드바 무리 제목 */
  .sgrp {
    font-size: 9.5px; font-weight: 800; color: var(--dim); letter-spacing: .4px;
    padding: 2px 8px 5px; text-transform: uppercase;
  }
  /* AI 사용량 타일 */
  .sus { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .sut { background: var(--card2); border-radius: 9px; padding: 8px 9px; }
  .sun { font-size: 11px; font-weight: 800; color: var(--fg); margin-bottom: 5px; }
  .sub + .sub { margin-top: 5px; }
  .subt { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--dim); }
  .subt b { color: var(--fg2); font-weight: 800; }
  .subk {
    display: block; height: 5px; border-radius: 999px; margin: 3px 0 2px;
    background: color-mix(in srgb, var(--fg) 16%, var(--card2)); overflow: hidden;
  }
  .subk i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .subr { display: block; font-size: 9px; color: var(--dim); }
  /* 원형으로 볼 때 — 사이드바가 좁으니 세 개씩 접어 넣는다 */
  .sus .rings { flex-wrap: wrap; gap: 6px 4px; justify-content: center; }
  .sus .ring { flex: 0 0 calc(33.33% - 3px); }
  .sus .ring .rs { font-size: 7.5px; }
  .sulg {
    width: 100%; margin-top: 4px; border: 1px solid var(--line); background: none;
    color: var(--dim); border-radius: 7px; padding: 5px; cursor: pointer;
    font-family: inherit; font-size: 10px; font-weight: 700;
  }
  .sulg:hover { background: var(--card); color: var(--fg); }
  .sulg.wide { margin-top: 0; }
  .sfoot { margin-top: auto; padding: 10px 8px 0; font-size: 10px; color: var(--dim); opacity: .75; }

  .main { flex: 1; min-width: 0; height: 100%; overflow-y: auto; padding: 0 24px 40px; }
  /* ★ 맨 위 붙박이 머리 — 제목 + 그 화면의 조작 줄(월 단추·검색·글자크기·오늘로).
     전에는 이 줄이 그냥 흘러가 버려서 «글자 크기 단추가 없다» 처럼 보였다. */
  .ehead {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); padding: 16px 0 6px;
    box-shadow: 0 6px 10px -8px rgba(0,0,0,.45);
  }
  .ehead .top2 { background: none; padding: 0; margin: 6px 0 0; }
  .main::-webkit-scrollbar { width: 9px; }
  .main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }

  /* ── 대시보드 칸 ── */
  .dcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
         gap: 10px; margin: 12px 0 4px; align-items: start; }
  .dc { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        overflow: hidden; }
  .dch { display: flex; align-items: center; gap: 8px; padding: 9px 12px 7px;
         font-size: calc(11px * var(--wf)); font-weight: 800; color: var(--dim);
         letter-spacing: .3px; }
  .dcgo { margin-left: auto; background: none; border: 0; cursor: pointer;
          font-family: inherit; font-size: calc(10px * var(--wf)); font-weight: 800;
          color: var(--accent); padding: 0; }
  .dcb { padding: 0 12px 11px; }
  .dbig { font-size: calc(17px * var(--wf)); font-weight: 800; color: var(--fg);
          line-height: 1.35; }
  /* 학년부 줄 */
  .dgp { margin-top: 7px; display: flex; flex-direction: column; gap: 4px; }
  .dgpr { display: flex; align-items: baseline; gap: 6px; font-size: calc(11.5px * var(--wf)); }
  .dgpr .gl { font-style: normal; font-size: calc(9.5px * var(--wf)); font-weight: 800;
              color: var(--dim); flex: 0 0 auto; }
  .dgpr b { font-size: calc(10px * var(--wf)); border-radius: 5px; padding: 1px 5px;
            flex: 0 0 auto; }
  .dgpr span { color: var(--fg2); min-width: 0; }
  /* 급식 */
  .dmr + .dmr { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); }
  .dmn { font-size: calc(10.5px * var(--wf)); font-weight: 800; color: var(--dim);
         margin-bottom: 4px; }
  .dmn em { font-style: normal; font-weight: 700; margin-left: 6px; opacity: .8; }
  .dmd { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .dmd span { font-size: calc(14px * var(--wf)); font-weight: 700; color: var(--fg); }
  /* 오늘 수업 */
  .dlr { display: flex; align-items: baseline; gap: 8px; padding: 3px 0;
         font-size: calc(12.5px * var(--wf)); }
  .dlr + .dlr { border-top: 1px solid var(--line); }
  .dlr i { font-style: normal; font-size: calc(10px * var(--wf)); font-weight: 800;
           color: var(--accent); flex: 0 0 auto; }
  .dlr b { font-weight: 800; color: var(--fg); flex: 0 0 auto; }
  .dlr span { color: var(--dim); font-size: calc(11px * var(--wf)); min-width: 0; }
  /* 앞으로 7일 */
  .dnr { display: flex; align-items: baseline; gap: 9px; padding: 3px 0;
         font-size: calc(12px * var(--wf)); }
  .dnr + .dnr { border-top: 1px solid var(--line); }
  .dnr i { font-style: normal; font-weight: 800; color: var(--dim); flex: 0 0 auto;
           font-size: calc(11px * var(--wf)); }
  .dnr i small { font-weight: 700; margin-left: 3px; opacity: .75; }
  .dnr span { color: var(--fg2); min-width: 0; }
  /* 대시보드 안의 바로가기 타일은 한 줄에 하나씩 */
  .dc .lnks { grid-template-columns: 1fr; gap: 5px; padding: 0; }

  .ph { display: flex; align-items: baseline; gap: 10px; margin-bottom: 0; }
  .ph h1 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .ph .sub { font-size: 12.5px; color: var(--dim); }
  .ph .sp { flex: 1; }

  /* 오늘 한 줄 요약 */
  .today {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
    background: var(--card); border-radius: 12px; padding: 14px 18px; margin: 4px 0 22px;
  }
  .today .big { font-size: 17px; font-weight: 800; }
  .today .it { font-size: 13px; color: var(--fg2); }
  .today .it b { color: var(--accent); font-weight: 800; margin-right: 5px; }

  /* 타일 */
  .grp { font-size: 12px; font-weight: 800; color: var(--dim); margin: 20px 0 9px;
         display: flex; align-items: center; gap: 7px; }
  .grp::before { content: ''; width: 7px; height: 7px; border-radius: 999px; background: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 11px; }
  .tile {
    position: relative; text-align: left; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 15px 16px; font-family: inherit; color: var(--fg);
    transition: transform .12s, border-color .12s;
  }
  .tile:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tile .ic {
    width: 34px; height: 34px; border-radius: 9px; display: flex;
    align-items: center; justify-content: center; margin-bottom: 11px;
    background: color-mix(in srgb, var(--accent) 20%, var(--card));
  }
  .tile .ic img { width: 22px; height: 22px; object-fit: contain; -webkit-user-drag: none; }
  .tile .tt { font-size: 14px; font-weight: 800; margin-bottom: 3px; }
  .tile .td { font-size: 11.5px; color: var(--dim); line-height: 1.5; }
  .tile .fav {
    position: absolute; top: 11px; right: 11px; border: 0; background: none;
    color: var(--dim); font-size: 14px; cursor: pointer; padding: 2px; line-height: 1;
  }
  .tile .fav.on { color: var(--accent); }
  .tile .fav:hover { color: var(--accent); }

  /* 안쪽 화면은 위젯 것을 그대로 쓰되 넓게 */
  #view { max-width: 1100px; }
  #view .top, #view .top2 { position: static; background: none; padding: 0; }
  #view .wkp, #view .rcb { font-size: calc(12.5px * var(--wf)); }
  #view .stile { font-size: calc(12.5px * var(--wf)); }
  .loading { padding: 40px 0; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<div class="ebar" id="ebar"></div>
<div class="ebody">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"><div class="loading">불러오는 중…</div></main>
</div>
<script src="views.js"></script>
<script src="easy.js"></script>
</body>
</html>
