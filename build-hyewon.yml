# 혜원이지 — 시간표만 뺀 «나눠 주기용» (구글 로그인도 필요 없다)
#
# ★ 설치 이름(HyewonDesk)·appId·업데이트 채널은 «일부러» 그대로 둔다.
#   바꾸면 이미 깔린 것이 자동 업데이트를 못 받고, 설정·구글 로그인도 초기화된다.
#   사람이 보는 이름만 «혜원이지» 다.
#
# ★ appId·설치 이름을 진호알리미와 따로 둔다.
#   그래야 한 PC에 둘 다 깔아도 설정·기록·자동 업데이트가 서로 섞이지 않는다.
# ★ 같은 저장소에 올리므로 업데이트 안내 파일 이름이 겹치면 안 된다.
#   channel 을 주면 latest.yml 대신 hyewon.yml 을 만들고, 이 앱은 그것만 본다.
appId: kr.hyewon.hyewondesk
productName: HyewonDesk
extraMetadata:
  flavor: hyewon         # main.js 가 이걸 읽어 시간표를 끈다
  # ★ 설정·기록이 저장되는 폴더는 «포장된 package.json 의 productName» 으로 정해진다.
  #   위쪽 productName 만 바꾸면 설치 파일 이름만 바뀌고 폴더는 그대로라,
  #   두 프로그램이 %APPDATA%\JindoWidget 을 함께 써서 설정이 섞인다. 여기서도 바꿔 준다.
  name: hyewon-desk
  productName: HyewonDesk
files:
  - main.js
  - preload.js
  - widget.html
  - ui.css        # 색·모양 (위젯과 혜원이지가 함께 쓴다)
  - views.js      # 화면을 만드는 코드 (마찬가지)
  - easy.html     # «넓게 보기» 창 (왼쪽 메뉴 + 대시보드)
  - easy.js
  - timetable.html
  - comcigan.js
  - fetchtext.js
  - worknotice.js
  - neis.js
  - academic.js
  - aiusage.js
  - httpx.js
  - googleauth.js
  - records.js
  - roster.js
  - recordsmain.js
  # 앱에 심어 두는 구글 클라이언트. 없어도 빌드는 되고, 그때는 설정에 직접 넣어야 한다
  - gclient.json
  - settings.html
  - assets/**
  - node_modules/**/*
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/hyewon-icon.png
  artifactName: HyewonDesk-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: 혜원이지
publish:
  - provider: github
    owner: Arete929
    repo: jindo-widget
    channel: hyewon
