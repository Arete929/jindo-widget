# 진호알리미 — 지금까지 쓰던 것 그대로 (시간표 있음)
#
# ★ 설치 이름(JindoWidget)과 appId 를 «일부러» 안 바꾼다.
#   바꾸면 설치 경로가 달라져서, 이미 깔려 있는 것이 자동 업데이트를 못 받고
#   옛 버전 그대로 남는다. 사람이 보는 이름만 진호알리미로 바꿨다(main.js 의 APP_NAME).
appId: kr.hyewon.jindowidget
productName: JindoWidget
extraMetadata:
  flavor: jinho          # main.js 가 이걸 읽어 시간표를 켠다
  # 설정 폴더(%APPDATA%\JindoWidget)를 그대로 지키려고 일부러 못박아 둔다 —
  # 이걸 바꾸면 지금까지 저장해 둔 설정·시간표·기록을 못 찾는다.
  name: jindo-widget
  productName: JindoWidget
files:
  - main.js
  - preload.js
  - help.js      # 도움말 글 (설정 창의 ❓ 도움말 판)
  - widget.html
  - ui.css        # 색·모양 (위젯과 혜원이지가 함께 쓴다)
  - views.js      # 화면을 만드는 코드 (마찬가지)
  - easy.html     # «넓게 보기» 창 (왼쪽 메뉴 + 대시보드)
  - easy.js
  - timetable.html
  - comcigan.js
  - fetchtext.js
  - worknotice.js
  - neis.js
  - academic.js
  - mealduty.js  # 급식지도 순서표 시트 읽기
  - gradeplan.js  # 학년부 일지 시트
  - weather.js    # 날씨·미세먼지 (Open-Meteo)
  - sysinfo.js    # 이 PC 의 CPU·램
  - aiusage.js
  - httpx.js
  - googleauth.js
  - records.js
  - roster.js
  - recordsmain.js
  - notion.js     # 업무관리 — 노션 PROJECTS·TASKS (진호알리미 전용)
  # 앱에 심어 두는 구글 클라이언트. 없어도 빌드는 되고, 그때는 설정에 직접 넣어야 한다
  - gclient.json
  - settings.html
  - assets/**
  - node_modules/**/*
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  artifactName: JindoWidget-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: 진호알리미
publish:
  - provider: github
    owner: Arete929
    repo: jindo-widget
